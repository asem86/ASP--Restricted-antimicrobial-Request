<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --ink:#16241F; --paper:#EEEFE6; --card:#FFFFFF; --line:#D9DBCC;
    --teal:#1F6F63; --teal-dark:#154F46; --approve:#3F8F5F; --reject:#B5482F;
    --escalate:#C98A2C; --neutral:#5B6B63;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; }
  h1,h2,h3{ font-family:'Source Serif 4', serif; color:var(--teal-dark); margin:0; }
  .wrap{ max-width:640px; margin:0 auto; padding:24px 16px 60px; }
  .header{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .logo{ height:40px; display:flex; align-items:center; }
  .logo img{ height:100%; width:auto; display:block; }
  .sub{ margin:0; font-size:13px; color:var(--neutral); }
  nav{ display:flex; gap:4px; background:var(--card); padding:4px; border-radius:10px; border:1px solid var(--line); margin-bottom:20px; }
  nav button{ flex:1; padding:9px 14px; border-radius:8px; border:none; background:transparent; color:var(--ink); font-size:13.5px; font-weight:500; cursor:pointer; font-family:inherit; }
  nav button.active{ background:var(--teal); color:#fff; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--neutral); margin-bottom:5px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px){ .grid{ grid-template-columns:1fr; } }
  input, select{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; background:#fff; color:var(--ink); }
  input:focus, select:focus{ outline:2px solid var(--teal); outline-offset:-1px; }
  input[readonly]{ background:var(--paper); color:var(--teal-dark); font-weight:600; }
  .section-divider{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--teal); margin:18px 0 8px; padding-top:14px; border-top:1px solid var(--line); }
  .section-divider:first-child{ margin-top:0; padding-top:0; border-top:none; }
  .btn-primary{ background:var(--teal); color:#fff; border:none; border-radius:8px; padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; width:100%; }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .muted{ color:var(--neutral); }
  .conn-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .req-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .req-card .req-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .status-pill{ display:inline-block; font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px; }
  .confirm-banner{ background:#EAF4EE; border:1px solid var(--approve); color:#1F5C36; padding:12px 14px; border-radius:10px; margin-bottom:18px; font-size:13.5px; }
  .app-footer{ text-align:center; margin-top:32px; padding-top:16px; border-top:1px solid var(--line); color:var(--neutral); font-size:12px; line-height:1.7; }
  .app-footer strong{ color:var(--teal-dark); }
</style>

  "Blood", "Sputum", "Urine", "CSF", "Pleural fluid", "Synovial fluid",
  "Ascitic fluid", "Wound/tissue culture", "Other body fluid",
];
const FREQUENCY_OPTIONS = [
  { id: "stat", label: "STAT" },
  { id: "q6h", label: "Every 6 hours" },
  { id: "q8h", label: "Every 8 hours" },
  { id: "q12h", label: "Every 12 hours" },
  { id: "q24h", label: "Every 24 hours" },
  { id: "q48h", label: "Every 48 hours" },
  { id: "q72h", label: "Every 72 hours" },
];
const DURATION_OPTIONS = ["STAT", ...Array.from({length:14}, (_,i)=>String(i+1))];

function calcCrCl(age, weightKg, sex, creatinineMgDl){
  const a = Number(age), w = Number(weightKg), cr = Number(creatinineMgDl);
  if (!a || !w || !cr) return null;
  let crcl = ((140 - a) * w) / (72 * cr);
  if (sex === "female") crcl *= 0.85;
  return Math.round(crcl * 10) / 10;
}

const MY_REQUESTS_KEY = "amr_my_request_ids";
const REQUESTER_PROFILE_KEY = "amr_requester_profile";
function loadRequesterProfile(){
  try { return JSON.parse(localStorage.getItem(REQUESTER_PROFILE_KEY) || "null"); } catch(e){ return null; }
}
function saveRequesterProfile(name, employeeId){
  try { localStorage.setItem(REQUESTER_PROFILE_KEY, JSON.stringify({ name, employeeId })); } catch(e){}
}
function clearRequesterProfile(){
  try { localStorage.removeItem(REQUESTER_PROFILE_KEY); } catch(e){}
  savedProfile = null;
  form.requesterName = ""; form.employeeId = "";
  render();
}
window.clearRequesterProfile = clearRequesterProfile;

function pad(n){ return String(n).padStart(2,"0"); }
function nowLocalDateTime(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dateOnly(dt){ return (dt||"").slice(0,10); }
function timeOnly(dt){ return (dt||"").slice(11,16); }
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function getMyRequestIds(){
  try { return JSON.parse(localStorage.getItem(MY_REQUESTS_KEY) || "[]"); } catch(e){ return []; }
}
function addMyRequestId(id){
  const ids = getMyRequestIds();
  ids.unshift(id);
  localStorage.setItem(MY_REQUESTS_KEY, JSON.stringify(ids.slice(0, 50)));
}

/* ============================================================
   State
   ============================================================ */
let tab = "new"; // "new" | "mine"
let submitted = false;
let myRequests = []; // live-synced docs for this device's submitted requests
let savedProfile = loadRequesterProfile();
let form = {
  fileNumber: "", patientName: "", department: DEPARTMENTS[0], bedNumber: "",
  diagnosis: "", justification: "",
  therapyBasis: "", organism: "", specimenSite: "",
  antibiotic: "", antibioticGroup: "", customAntibiotic: "",
  age: "", weight: "", sex: "", creatinine: "",
  dose: "", frequency: "", duration: "",
  notes: "", requesterName: savedProfile ? savedProfile.name : "", employeeId: savedProfile ? savedProfile.employeeId : "",
};

function resolvedAntibiotic(){ return form.antibiotic === "__other__" ? form.customAntibiotic.trim() : form.antibiotic; }
function isFileNumberValid(v){ return /^[0-9]{7}$/.test(v || ""); }
function isEmployeeIdValid(v){ return /^[0-9]{8}$/.test(v || ""); }

/* Subscribe individually to each of this device's submitted request docs,
   so status updates (approved/rejected) show live without needing login. */
let unsubscribers = [];
function subscribeMine(){
  unsubscribers.forEach(u => u());
  unsubscribers = [];
  myRequests = [];
  if (!requestsRef) return;
  const ids = getMyRequestIds();
  ids.forEach(id => {
    const unsub = requestsRef.doc(id).onSnapshot(
      (snap) => {
        if (snap.exists) {
          const data = { id: snap.id, ...snap.data() };
          const idx = myRequests.findIndex(r => r.id === id);
          if (idx >= 0) myRequests[idx] = data; else myRequests.push(data);
          myRequests.sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
          render();
        }
      },
      (err) => console.error(err)
    );
    unsubscribers.push(unsub);
  });
}
subscribeMine();

/* ============================================================
   Actions
   ============================================================ */
function canSubmitRequest(){
  const abx = resolvedAntibiotic();
  const validSpecimen = form.therapyBasis !== "culture" || !!form.specimenSite;
  return !!(abx && isFileNumberValid(form.fileNumber) && form.requesterName.trim() && isEmployeeIdValid(form.employeeId)
    && form.diagnosis.trim() && form.justification.trim() && form.dose.trim() && validSpecimen);
}

async function submitRequest(){
  if (!canSubmitRequest()) return;
  const abx = resolvedAntibiotic();
  const crcl = calcCrCl(form.age, form.weight, form.sex, form.creatinine);
  const req = {
    dateTime: nowLocalDateTime(), fileNumber: form.fileNumber, patientName: form.patientName,
    department: form.department, bedNumber: form.bedNumber,
    diagnosis: form.diagnosis, justification: form.justification,
    therapyBasis: form.therapyBasis, organism: form.therapyBasis === "culture" ? form.organism : "",
    specimenSite: form.therapyBasis === "culture" ? form.specimenSite : "",
    antibiotic: abx, group: form.antibioticGroup || "Other",
    age: form.age || null, weight: form.weight || null, sex: form.sex || "",
    creatinine: form.creatinine || null, crcl: crcl,
    dose: form.dose, frequency: form.frequency, duration: form.duration,
    notes: form.notes, requesterName: form.requesterName, employeeId: form.employeeId,
    status: "pending", createdAt: Date.now(),
  };
  if (!requestsRef) { alert("This form isn't connected yet — please contact the ID department."); return; }
  try {
    const ref = await requestsRef.add(req);
    addMyRequestId(ref.id);
    saveRequesterProfile(form.requesterName, form.employeeId);
    savedProfile = { name: form.requesterName, employeeId: form.employeeId };
    subscribeMine();
    submitted = true;
    form = {
      fileNumber: "", patientName: "", department: DEPARTMENTS[0], bedNumber: "",
      diagnosis: "", justification: "",
      therapyBasis: "", organism: "", specimenSite: "",
      antibiotic: "", antibioticGroup: "", customAntibiotic: "",
      age: "", weight: "", sex: "", creatinine: "",
      dose: "", frequency: "", duration: "",
      notes: "", requesterName: form.requesterName, employeeId: form.employeeId,
    };
    render();
  } catch(e){
    alert("Could not submit: " + e.message);
  }
}
window.submitRequest = submitRequest;

function updateForm(key, val){ form[key] = val; render(); }
window.updateForm = updateForm;

function pickAntibiotic(val){
  const group = val === "__other__" ? "Other" : (ANTIBIOTIC_GROUPS.A.includes(val) ? "A" : "B");
  form.antibiotic = val; form.antibioticGroup = group; render();
}
window.pickAntibiotic = pickAntibiotic;

function setTab(t){ tab = t; submitted = false; render(); }
window.setTab = setTab;

/* ============================================================
   Rendering
   ============================================================ */
function render(){
  const app = document.getElementById("app");

  const active = document.activeElement;
  const activeId = (active && active.id && app.contains(active)) ? active.id : null;
  const selStart = activeId && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = activeId && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  app.innerHTML = `
    <div class="header">
      <div class="logo"><img src="${LOGO_DATA_URI}" alt="Al-Sobh Hospital" /></div>
      <div>
        <h1 style="font-size:19px;">Restricted Antibiotic Request</h1>
        <p class="sub">Al-Sobh Hospital, Infectious Diseases Department ${requestsRef ? '<span class="conn-dot" style="background:var(--approve)"></span>connected' : '<span class="conn-dot" style="background:var(--reject)"></span>not connected'}</p>
      </div>
    </div>
    <nav>
      <button class="${tab==='new'?'active':''}" onclick="setTab('new')">New request</button>
      <button class="${tab==='mine'?'active':''}" onclick="setTab('mine')">My requests${myRequests.length?` (${myRequests.length})`:''}</button>
    </nav>
    ${tab === "new" ? renderNewRequest() : renderMyRequests()}
    <div class="app-footer">
      <strong>Alsobh Hospital, Infectious Diseases Department</strong><br/>
      By Dr. Asem Naji
    </div>
  `;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch(e) {}
      }
    }
  }
}

function renderNewRequest(){
  const canSubmit = canSubmitRequest();
  const crcl = calcCrCl(form.age, form.weight, form.sex, form.creatinine);
  return `
    ${submitted ? `<div class="confirm-banner">Request submitted. The ID team will review it shortly — check the "My requests" tab for the status.</div>` : ""}
    <div class="card">
      <div class="section-divider">Patient</div>
      <div class="grid">
        <div class="field">
          <label>File number (required, exactly 7 digits)</label>
          <input id="f-fileNumber" inputmode="numeric" value="${esc(form.fileNumber)}" placeholder="e.g. 1234567" maxlength="7" oninput="updateForm('fileNumber', this.value.replace(/[^0-9]/g,'').slice(0,7))" />
        </div>
        <div class="field">
          <label>Patient name</label>
          <input id="f-patientName" value="${esc(form.patientName)}" placeholder="Patient's name" oninput="updateForm('patientName', this.value)" />
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <label>Department</label>
          <select onchange="updateForm('department', this.value)">
            ${DEPARTMENTS.map(d => `<option value="${d}" ${form.department===d?'selected':''}>${d}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Bed number</label>
          <select onchange="updateForm('bedNumber', this.value)">
            <option value="" ${!form.bedNumber?'selected':''}>Select bed...</option>
            ${BED_NUMBERS.map(b => `<option value="${b}" ${form.bedNumber===b?'selected':''}>${b}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Diagnosis (required)</label>
        <input id="f-diagnosis" value="${esc(form.diagnosis)}" placeholder="e.g. VAP, febrile neutropenia" oninput="updateForm('diagnosis', this.value)" />
      </div>
      <div class="field">
        <label>Justification for this restricted antibiotic (required)</label>
        <input id="f-justification" value="${esc(form.justification)}" placeholder="Why this agent is needed" oninput="updateForm('justification', this.value)" />
      </div>

      <div class="section-divider">Therapy basis</div>
      <div class="field">
        <label>Empirical or culture-based</label>
        <select onchange="updateForm('therapyBasis', this.value)">
          <option value="" ${!form.therapyBasis?'selected':''}>Select basis...</option>
          ${THERAPY_BASIS.map(b => `<option value="${b.id}" ${form.therapyBasis===b.id?'selected':''}>${b.label}</option>`).join("")}
        </select>
      </div>
      ${form.therapyBasis === "culture" ? `
      <div class="grid">
        <div class="field">
          <label>Culture specimen site (required)</label>
          <select onchange="updateForm('specimenSite', this.value)">
            <option value="" ${!form.specimenSite?'selected':''}>Select specimen site...</option>
            ${SPECIMEN_SITES.map(s => `<option value="${esc(s)}" ${form.specimenSite===s?'selected':''}>${esc(s)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Organism / microbe (optional — leave blank if pending)</label>
          <input id="f-organism" value="${esc(form.organism)}" placeholder="e.g. MRSA, E. coli" oninput="updateForm('organism', this.value)" />
        </div>
      </div>` : ""}

      <div class="section-divider">Antibiotic</div>
      <div class="field">
        <label>Antibiotic requested</label>
        <select onchange="pickAntibiotic(this.value)">
          <option value="" disabled ${!form.antibiotic?'selected':''}>Select antibiotic...</option>
          <optgroup label="Group A — ID approval only">
            ${ANTIBIOTIC_GROUPS.A.map(a => `<option value="${esc(a)}" ${form.antibiotic===a?'selected':''}>${esc(a)}</option>`).join("")}
          </optgroup>
          <optgroup label="Group B — lifesaving, review after 48h">
            ${ANTIBIOTIC_GROUPS.B.map(a => `<option value="${esc(a)}" ${form.antibiotic===a?'selected':''}>${esc(a)}</option>`).join("")}
          </optgroup>
          <option value="__other__" ${form.antibiotic==='__other__'?'selected':''}>Other (type name)</option>
        </select>
        ${form.antibiotic === "__other__" ? `<input id="f-customAntibiotic" style="margin-top:6px;" value="${esc(form.customAntibiotic)}" placeholder="Type antibiotic name" oninput="updateForm('customAntibiotic', this.value)" />` : ""}
      </div>

      <div class="section-divider">Dosing (optional — helps calculate creatinine clearance)</div>
      <div class="grid">
        <div class="field">
          <label>Age (years)</label>
          <input id="f-age" type="number" min="0" max="120" value="${esc(form.age)}" oninput="updateForm('age', this.value)" />
        </div>
        <div class="field">
          <label>Weight (kg)</label>
          <input id="f-weight" type="number" min="0" step="0.1" value="${esc(form.weight)}" oninput="updateForm('weight', this.value)" />
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <label>Sex</label>
          <select onchange="updateForm('sex', this.value)">
            <option value="" ${!form.sex?'selected':''}>Select...</option>
            <option value="male" ${form.sex==='male'?'selected':''}>Male</option>
            <option value="female" ${form.sex==='female'?'selected':''}>Female</option>
          </select>
        </div>
        <div class="field">
          <label>Serum creatinine (mg/dL)</label>
          <input id="f-creatinine" type="number" min="0" step="0.01" value="${esc(form.creatinine)}" oninput="updateForm('creatinine', this.value)" />
        </div>
      </div>
      <div class="field">
        <label>Creatinine clearance (auto-calculated, Cockcroft-Gault)</label>
        <input value="${crcl!=null ? crcl + ' mL/min' : ''}" placeholder="Fill age, weight, sex &amp; creatinine above" readonly />
      </div>
      <div class="field">
        <label>Dose (required)</label>
        <input id="f-dose" value="${esc(form.dose)}" placeholder="e.g. 1 g IV" oninput="updateForm('dose', this.value)" />
      </div>
      <div class="grid">
        <div class="field">
          <label>Frequency</label>
          <select onchange="updateForm('frequency', this.value)">
            <option value="" ${!form.frequency?'selected':''}>Select frequency...</option>
            ${FREQUENCY_OPTIONS.map(f => `<option value="${f.id}" ${form.frequency===f.id?'selected':''}>${f.label}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Duration</label>
          <select onchange="updateForm('duration', this.value)">
            <option value="" ${!form.duration?'selected':''}>Select duration...</option>
            ${DURATION_OPTIONS.map(v => `<option value="${v}" ${form.duration===v?'selected':''}>${v === "STAT" ? "STAT" : v + (v==="1"?" day":" days")}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Notes (optional)</label>
        <input id="f-notes" value="${esc(form.notes)}" oninput="updateForm('notes', this.value)" />
      </div>

      <div class="section-divider">Requested by</div>
      ${savedProfile && form.requesterName === savedProfile.name && form.employeeId === savedProfile.employeeId ? `
      <div style="font-size:12.5px; color:var(--neutral); margin-bottom:8px;">
        Remembered as <strong style="color:var(--teal-dark);">${esc(form.requesterName)}</strong> (ID ${esc(form.employeeId)}) on this device.
        <a href="#" onclick="clearRequesterProfile(); return false;" style="color:var(--teal); margin-left:4px;">Not you?</a>
      </div>` : `
      <div class="grid">
        <div class="field">
          <label>Your name (required)</label>
          <input id="f-requesterName" value="${esc(form.requesterName)}" placeholder="e.g. Dr. Sara" oninput="updateForm('requesterName', this.value)" />
        </div>
        <div class="field">
          <label>Employee ID (required, 8 digits)</label>
          <input id="f-employeeId" inputmode="numeric" value="${esc(form.employeeId)}" placeholder="e.g. 12345678" maxlength="8" oninput="updateForm('employeeId', this.value.replace(/[^0-9]/g,'').slice(0,8))" />
        </div>
      </div>
      <p class="muted" style="font-size:11.5px; margin-top:-6px; margin-bottom:14px;">Saved on this device after your first request, so you won't need to type it again.</p>`}
      <button class="btn-primary" ${canSubmit?'':'disabled'} onclick="submitRequest()">Submit request</button>
    </div>
  `;
}

function renderMyRequests(){
  if (myRequests.length === 0) {
    return `<div class="card"><p class="muted">No requests submitted from this device yet. Once you submit a request, it'll show up here with its status.</p></div>`;
  }
  return myRequests.map(r => {
    const statusColor = r.status === "approve" ? "var(--approve)" : r.status === "reject" ? "var(--reject)" : "var(--escalate)";
    const statusLabel = r.status === "approve" ? "Approved" : r.status === "reject" ? "Rejected" : "Pending";
    const doseLine = [r.dose, r.frequency ? (FREQUENCY_OPTIONS.find(f=>f.id===r.frequency)||{}).label : "", r.duration ? (r.duration==="STAT"?"STAT":r.duration+" days") : ""].filter(Boolean).join(" · ");
    return `<div class="req-card">
      <div class="req-top">
        <div>
          <div style="font-weight:600; font-size:14.5px;">${esc(r.antibiotic||"")} <span class="muted" style="font-weight:400; font-size:12.5px;">— File ${esc(r.fileNumber||"")}${r.bedNumber?', Bed '+esc(r.bedNumber):''}, ${esc(r.department||"")}</span></div>
          ${r.patientName ? `<div class="muted" style="font-size:12.5px; margin-top:2px;">${esc(r.patientName)}</div>` : ""}
          <div class="muted" style="font-size:12.5px; margin-top:2px;">${esc(r.diagnosis||"")}</div>
          ${doseLine ? `<div class="muted" style="font-size:12.5px; margin-top:2px;">${esc(doseLine)}</div>` : ""}
          <div class="muted" style="font-size:12px; margin-top:2px;">Submitted ${dateOnly(r.dateTime)} ${timeOnly(r.dateTime)}</div>
        </div>
        <span class="status-pill" style="background:${statusColor}; color:#fff;">${statusLabel}</span>
      </div>
    </div>`;
  }).join("");
}

render();
</script>
</body>
</html>
